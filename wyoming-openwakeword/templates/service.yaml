# Headless governing Service (required by the StatefulSet for stable pod
# identity). Clients connect to the ClusterIP Service below.
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wyoming-openwakeword.fullname" . }}-h
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wyoming-openwakeword.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "wyoming-openwakeword.selectorLabels" . | nindent 4 }}
  ports:
    - name: wyoming
      port: {{ .Values.service.port }}
      targetPort: wyoming
      protocol: TCP
# ClusterIP Service -- the endpoint Home Assistant (or any Wyoming client)
# points at: <fullname>.<namespace>.svc:<port>. Detection state is per TCP
# connection, so round-robin across replicas is safe (each connection is
# handled wholly by one pod).
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wyoming-openwakeword.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wyoming-openwakeword.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "wyoming-openwakeword.selectorLabels" . | nindent 4 }}
  ports:
    - name: wyoming
      port: {{ .Values.service.port }}
      targetPort: wyoming
      protocol: TCP