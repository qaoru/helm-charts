{{- if .Values.networkPolicy.enabled }}
{{- $flavor := .Values.networkPolicy.flavor }}
{{- if eq $flavor "kubernetes" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wyoming-openwakeword.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wyoming-openwakeword.labels" . | nindent 4 }}
spec:
  policyTypes:
    - Ingress
    - Egress
  podSelector:
    matchLabels:
      {{- include "wyoming-openwakeword.selectorLabels" . | nindent 6 }}
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
  egress:
    {{- /* DNS to kube-dns: the model-fetch init container resolves
         the collection / custom URLs. */}}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.networkPolicy.allowModelDownloads }}
    {{- /* HTTPS anywhere: model downloads (community collection,
         GitHub releases, any custom `url`). Only needed by the init container. */}}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- else if eq $flavor "cilium" }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "wyoming-openwakeword.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wyoming-openwakeword.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "wyoming-openwakeword.selectorLabels" . | nindent 6 }}
  {{- if .Values.networkPolicy.cilium.ingress }}
  ingress:
    {{- toYaml .Values.networkPolicy.cilium.ingress | nindent 4 }}
  {{- else }}
  # Default ingress: Wyoming clients labelled
  # app.kubernetes.io/name=home-assistant (the Home Assistant chart naming) in
  # the release namespace, on the Wyoming port.
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace | quote }}
            app.kubernetes.io/name: home-assistant
      toPorts:
        - ports:
            - port: {{ .Values.service.port | quote }}
              protocol: TCP
  {{- end }}
  egress:
    {{- /* DNS to kube-dns: the model-fetch init container resolves
         the collection / custom URLs. */}}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    {{- if .Values.networkPolicy.allowModelDownloads }}
    {{- /* HTTPS anywhere: model downloads (community collection,
         GitHub releases, any custom `url`). Only needed by the init container. */}}
    - toCIDR:
        - 0.0.0.0/0
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.cilium.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- else }}
{{- fail (printf "wyoming-openwakeword: unsupported networkPolicy.flavor %q (expected \"kubernetes\" or \"cilium\")" $flavor) }}
{{- end }}
{{- end }}