    version: 0.2.2
  - annotations:
      artifacthub.io/changes: |
        - kind: fixed
          description: "`networkPolicy.enabled: false` now actually suppresses the embedded CiliumNetworkPolicy. Sprig's `default` treats `false` as empty, so `($np.enabled | default true)` evaluated to `true` even when an instance disabled the policy; switched to a hasKey check so an explicit `false` is respected."
        - kind: fixed
          description: "Instance-level `runtimeClassName` and `nodeSelector` are now honored when set to an explicit empty value (`\"\"` / `{}`), so a workstation can drop a chart-wide `kata` setting. Switched from Sprig `default` (which treats `\"\"`/`{}` as empty and falls back to the chart-wide value) to a hasKey check: omit the key to inherit the chart-wide default, set it (including empty) to override. The default instance now omits these keys so it inherits chart-wide settings."
      artifacthub.io/images: |-
        - name: open-terminal
          image: ghcr.io/open-webui/open-terminal:0.12.3-slim
      artifacthub.io/links: |
        - name: Open Terminal (upstream)
          url: https://github.com/open-webui/open-terminal
        - name: Source repository
          url: https://github.com/qaoru/helm-charts/tree/main/open-terminal
      artifacthub.io/maintainers: |
        - name: qaoru
          email: paul@qaoru.fr
