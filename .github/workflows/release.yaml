name: Release Charts

on:
  push:
    branches:
      - main
    tags:
      # Per-chart release tags: <chart>-<version>, e.g. open-terminal-0.1.1,
      # unifi-1.2.0. The chart name is the prefix before the trailing -X.Y.Z.
      # (Only manual/human tag pushes trigger this — tags pushed by this
      # workflow via GITHUB_TOKEN do NOT re-trigger it, so the publish for
      # push-to-main releases is done in the same job as the prep below.)
      - '*-*.*.*'
  # Manual recovery / re-publish of an existing <chart>-<version> tag.
  workflow_dispatch:
    inputs:
      chart:
        description: Chart name (directory) to publish, e.g. unifi
        required: true
        type: string
      version:
        description: Chart version to publish, e.g. 1.1.1
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  pages: write

jobs:
  # On a push to main, detect every chart whose `version` and/or `appVersion`
  # in <chart>/Chart.yaml changed compared to the previous state of the branch.
  # A change to either triggers a release for that chart. An appVersion change
  # without a chart version change triggers an automatic patch version bump in
  # the release job (so image updates from Renovate cut a release).
  detect:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.detect.outputs.charts }}
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed charts
        id: detect
        run: |
          set -euo pipefail
          export BEFORE="${{ github.event.before }}"
          python3 - <<'PY'
          import json, os, subprocess
          before = os.environ['BEFORE']
          zero = '0' * 40

          charts = sorted(
              d for d in os.listdir('.')
              if os.path.isdir(d) and os.path.isfile(os.path.join(d, 'Chart.yaml'))
          )

          def read_field(text, key):
              for line in text.splitlines():
                  if line.startswith(key + ':'):
                      return line.split(':', 1)[1].strip().strip('"')
              return None

          def show(path):
              r = subprocess.run(['git', 'show', f'{before}:{path}'],
                                 capture_output=True, text=True)
              return r.stdout if r.returncode == 0 else None

          result = []
          for c in charts:
              p = f'{c}/Chart.yaml'
              cur = open(p).read()
              new_ver = read_field(cur, 'version')
              new_app = read_field(cur, 'appVersion')
              if before and before != zero:
                  prev = show(p)
                  prev_ver = read_field(prev, 'version') if prev else None
                  prev_app = read_field(prev, 'appVersion') if prev else None
                  vchg = new_ver != prev_ver
                  appchg = new_app != prev_app
              else:
                  vchg = appchg = True
              if vchg or appchg:
                  result.append({
                      'chart': c,
                      'version': new_ver,
                      'version_changed': vchg,
                      'appversion_changed': appchg,
                  })

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'charts={json.dumps(result)}\n')
              f.write(f'changed={"true" if result else "false"}\n')
          print(json.dumps(result, indent=2))
          PY

  # Release job. Runs in three modes, all of which populate /tmp/targets.txt
  # with one "<chart> <version>" line per chart to publish, then run the same
  # publish loop:
  #
  #   1. push-to-main with changed charts  — auto-bump (if only appVersion
  #      changed), regenerate README with helm-docs, commit, push a
  #      <chart>-<version> tag per chart, then publish. Publish happens in THIS
  #      job because the GITHUB_TOKEN-pushed tag does not re-trigger the
  #      workflow.
  #   2. manual <chart>-<version> tag push — resolve chart + version from the
  #      tag, then publish.
  #   3. workflow_dispatch (recovery)      — publish the given chart + version.
  release:
    needs: detect
    if: |
      always() &&
      (
        (needs.detect.result == 'success' && needs.detect.outputs.changed == 'true') ||
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git for bot commits
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4

      - name: Install oras
        uses: oras-project/setup-oras@v2
        with:
          version: 1.3.3

      - name: Install helm-docs
        env:
          HELM_DOCS_VERSION: v1.14.2
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm-docs.tar.gz \
            "https://github.com/norwoodj/helm-docs/releases/download/${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION#v}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/helm-docs.tar.gz -C /tmp helm-docs
          sudo install -m 0755 /tmp/helm-docs /usr/local/bin/helm-docs
          helm-docs --version

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Mode 1: push-to-main prep -----------------------------------------
      # Auto-bump, regen docs, commit, and push a <chart>-<version> tag per
      # changed chart. Writes /tmp/targets.txt with the FINAL (post-bump)
      # versions and /tmp/release_label.txt for the commit message.
      - name: Prepare changed charts (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CHARTS: ${{ needs.detect.outputs.charts }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess

          charts = json.loads(os.environ['CHARTS'])
          targets = []
          for entry in charts:
              c = entry['chart']
              path = f'{c}/Chart.yaml'
              text = open(path).read()

              # Auto-bump the chart patch version when only appVersion changed
              # (no manual version bump), and add an Artifact Hub changelog
              # entry describing the image update.
              if entry['appversion_changed'] and not entry['version_changed']:
                  m = re.search(r'^version:\s*(\d+)\.(\d+)\.(\d+)', text, re.M)
                  if not m:
                      raise SystemExit(f'{c}: could not parse chart version')
                  new_version = f'{m.group(1)}.{m.group(2)}.{int(m.group(3)) + 1}'
                  text = re.sub(r'^version:.*$', f'version: {new_version}',
                                text, count=1, flags=re.M)
                  am = re.search(r'^appVersion:\s*"?([^\s"]+)"?', text, re.M)
                  appver = am.group(1)
                  new_changes = (
                      '  artifacthub.io/changes: |\n'
                      f'    - kind: changed\n'
                      f'      description: Update {c} image to {appver}\n'
                  )
                  text = re.sub(
                      r'  artifacthub\.io/changes:\s*\|\n(?:    .*\n)+',
                      new_changes, text, count=1)
                  open(path, 'w').write(text)
                  print(f'{c}: auto-bumped chart version to {new_version} '
                        f'for image {appver}')
                  version = new_version
              else:
                  version = entry['version']

              # Regenerate this chart's README from README.md.gotmpl + values.yaml.
              subprocess.run(['helm-docs', '--chart-to-generate', c], check=True)
              targets.append((c, version))

          with open('/tmp/targets.txt', 'w') as f:
              for c, v in targets:
                  f.write(f'{c} {v}\n')
          with open('/tmp/release_label.txt', 'w') as f:
              f.write(', '.join(f'{c}-{v}' for c, v in targets))
          PY

      - name: Commit release prep and push version tags (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # Stage every changed chart's Chart.yaml and README.md.
          git add -A -- '*/Chart.yaml' '*/README.md'
          LABEL="$(cat /tmp/release_label.txt)"
          if ! git diff --quiet --cached; then
            git commit -m "release(): prepare ${LABEL}"
            git push
          fi
          # Create and push a <chart>-<version> tag for each prepared chart.
          while read -r CHART VERSION; do
            [ -n "$CHART" ] || continue
            TAG="${CHART}-${VERSION}"
            if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              git tag "$TAG"
              git push origin "$TAG"
            fi
          done < /tmp/targets.txt

      # --- Mode 2: manual tag push -------------------------------------------
      - name: Resolve target from tag (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          CHART="$(printf '%s' "$TAG" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+$//')"
          VERSION="${TAG#${CHART}-}"
          [ -f "${CHART}/Chart.yaml" ] || { echo "chart ${CHART} not found"; exit 1; }
          printf '%s %s\n' "$CHART" "$VERSION" > /tmp/targets.txt

      # --- Mode 3: workflow_dispatch recovery --------------------------------
      - name: Resolve target from inputs (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          CHART="${{ inputs.chart }}"
          VERSION="${{ inputs.version }}"
          [ -f "${CHART}/Chart.yaml" ] || { echo "chart ${CHART} not found"; exit 1; }
          printf '%s %s\n' "$CHART" "$VERSION" > /tmp/targets.txt

      # --- Publish loop (shared by all modes) --------------------------------
      - name: Publish charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while read -r CHART VERSION; do
            [ -n "$CHART" ] || continue
            TAG="${CHART}-${VERSION}"
            echo "::group::Publish ${TAG}"
            helm dependency update "${CHART}/"
            helm lint "${CHART}/"
            helm package "${CHART}/" --destination ./chart-packages
            helm push "./chart-packages/${CHART}-${VERSION}.tgz" oci://ghcr.io/qaoru/helm-charts
            cosign sign --yes "ghcr.io/qaoru/helm-charts/${CHART}:${VERSION}"
            oras push \
              "ghcr.io/qaoru/helm-charts/${CHART}:artifacthub.io" \
              --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
              artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
            # GitHub Release (idempotent: skip if it already exists).
            if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "release ${TAG} already exists, skipping creation"
            else
              gh release create "${TAG}" \
                --title "${TAG}" \
                --generate-notes \
                "./chart-packages/${CHART}-${VERSION}.tgz"
            fi
            echo "::endgroup::"
          done < /tmp/targets.txt

  # Build and publish the classic HTTP(S) Helm repository index.yaml to the
  # gh-pages branch, so charts are consumable via `helm repo add` as well as
  # via OCI.
  #
  # NOTE: `cr index` does NOT scan GitHub Releases. It globs for local
  # `*.tgz` files in --package-path (default .cr-release-packages/), reads
  # each chart's Chart.yaml metadata, then calls the GitHub API to resolve
  # the matching <chart>-<version> release and record its asset download URL
  # in index.yaml. So the released .tgz archives must be present locally
  # before `cr index` runs. We download them from every <chart>-<semver>
  # release (skipping legacy `v*` tags, whose release name would not match
  # cr's <name>-<version> template and would make `cr index` fail).
  #
  # GitHub Pages (enable once in repo Settings -> Pages -> Source: Deploy
  # from a branch -> gh-pages / root) then serves index.yaml at
  # https://<owner>.github.io/<repo>.
  pages:
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git for bot commits
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure gh-pages branch exists
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git checkout --orphan gh-pages
            git rm -rf . || true
            printf '# Helm chart repository\n\nThis branch hosts the `index.yaml` for the HTTP(S) Helm repository.\nChart archives are served from the per-chart GitHub Releases.\n' > README.md
            git add README.md
            git commit -m "pages(): initialize gh-pages branch"
            git push origin gh-pages
          fi

      - name: Install chart-releaser
        env:
          CR_VERSION: "1.8.1"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cr.tar.gz \
            "https://github.com/helm/chart-releaser/releases/download/v${CR_VERSION}/chart-releaser_${CR_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/cr.tar.gz -C /tmp cr
          sudo install -m 0755 /tmp/cr /usr/local/bin/cr
          cr version

      - name: Download released chart packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .cr-release-packages
          # Only <chart>-<semver> tags match cr's release-name template;
          # legacy v* tags are skipped so `cr index` can resolve every
          # downloaded package to an existing release.
          gh release list --limit 200 --json tagName -q '.[].tagName' | while read -r TAG; do
            if printf '%s' "$TAG" | grep -Eq '^[a-z][a-z0-9-]*-[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Downloading .tgz assets from release ${TAG}"
              gh release download "$TAG" \
                --dir .cr-release-packages \
                --pattern '*.tgz' \
                --clobber || true
            else
              echo "Skipping non-chart tag ${TAG}"
            fi
          done
          echo "Downloaded packages:"
          ls -la .cr-release-packages

      - name: Rebuild and push Helm repo index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cr index \
            --owner "${{ github.repository_owner }}" \
            --git-repo "${{ github.event.repository.name }}" \
            --token "${GH_TOKEN}" \
            --push
