name: Release Charts

on:
  push:
    branches:
      - main
    tags:
      # Per-chart release tags: <chart>-<version>, e.g. open-terminal-0.1.1,
      # unifi-1.2.0. The chart name is the prefix before the trailing -X.Y.Z.
      - '*-*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # On a push to main, detect every chart whose `version` and/or `appVersion`
  # in <chart>/Chart.yaml changed compared to the previous state of the branch.
  # A change to either triggers a release for that chart. An appVersion change
  # without a chart version change triggers an automatic patch version bump in
  # the release-prep job (so image updates from Renovate cut a release).
  detect:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.detect.outputs.charts }}
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed charts
        id: detect
        run: |
          set -euo pipefail
          export BEFORE="${{ github.event.before }}"
          python3 - <<'PY'
          import json, os, subprocess
          before = os.environ['BEFORE']
          zero = '0' * 40

          charts = sorted(
              d for d in os.listdir('.')
              if os.path.isdir(d) and os.path.isfile(os.path.join(d, 'Chart.yaml'))
          )

          def read_field(text, key):
              for line in text.splitlines():
                  if line.startswith(key + ':'):
                      return line.split(':', 1)[1].strip().strip('"')
              return None

          def show(path):
              r = subprocess.run(['git', 'show', f'{before}:{path}'],
                                 capture_output=True, text=True)
              return r.stdout if r.returncode == 0 else None

          result = []
          for c in charts:
              p = f'{c}/Chart.yaml'
              cur = open(p).read()
              new_ver = read_field(cur, 'version')
              new_app = read_field(cur, 'appVersion')
              if before and before != zero:
                  prev = show(p)
                  prev_ver = read_field(prev, 'version') if prev else None
                  prev_app = read_field(prev, 'appVersion') if prev else None
                  vchg = new_ver != prev_ver
                  appchg = new_app != prev_app
              else:
                  vchg = appchg = True
              if vchg or appchg:
                  result.append({
                      'chart': c,
                      'version': new_ver,
                      'version_changed': vchg,
                      'appversion_changed': appchg,
                  })

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'charts={json.dumps(result)}\n')
              f.write(f'changed={"true" if result else "false"}\n')
          print(json.dumps(result, indent=2))
          PY

  # Prepare releases for every changed chart: auto-bump the chart patch
  # version when only appVersion changed (e.g. a Renovate image-update PR),
  # regenerate each changed chart's README with helm-docs, then commit and push
  # a <chart>-<version> tag per chart. The tag push triggers release-publish.
  #
  # Runs as a single looping job (not a matrix) so the commit + tag push is a
  # single linear sequence — no concurrent git push races when several charts
  # changed in the same push to main.
  release-prep:
    needs: detect
    if: needs.detect.result == 'success' && needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git for bot commits
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install helm-docs
        env:
          HELM_DOCS_VERSION: v1.14.2
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm-docs.tar.gz \
            "https://github.com/norwoodj/helm-docs/releases/download/${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION#v}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/helm-docs.tar.gz -C /tmp helm-docs
          sudo install -m 0755 /tmp/helm-docs /usr/local/bin/helm-docs
          helm-docs --version

      - name: Prepare changed charts
        env:
          CHARTS: ${{ needs.detect.outputs.charts }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess

          charts = json.loads(os.environ['CHARTS'])
          tags = []
          for entry in charts:
              c = entry['chart']
              path = f'{c}/Chart.yaml'
              text = open(path).read()

              # Auto-bump the chart patch version when only appVersion changed
              # (no manual version bump), and add an Artifact Hub changelog
              # entry describing the image update.
              if entry['appversion_changed'] and not entry['version_changed']:
                  m = re.search(r'^version:\s*(\d+)\.(\d+)\.(\d+)', text, re.M)
                  if not m:
                      raise SystemExit(f'{c}: could not parse chart version')
                  new_version = f'{m.group(1)}.{m.group(2)}.{int(m.group(3)) + 1}'
                  text = re.sub(r'^version:.*$', f'version: {new_version}',
                                text, count=1, flags=re.M)
                  am = re.search(r'^appVersion:\s*"?([^\s"]+)"?', text, re.M)
                  appver = am.group(1)
                  new_changes = (
                      '  artifacthub.io/changes: |\n'
                      f'    - kind: changed\n'
                      f'      description: Update {c} image to {appver}\n'
                  )
                  text = re.sub(
                      r'  artifacthub\.io/changes:\s*\|\n(?:    .*\n)+',
                      new_changes, text, count=1)
                  open(path, 'w').write(text)
                  print(f'{c}: auto-bumped chart version to {new_version} '
                        f'for image {appver}')
                  version = new_version
              else:
                  version = entry['version']

              # Regenerate this chart's README from README.md.gotmpl + values.yaml.
              subprocess.run(['helm-docs', '--chart-to-generate', c], check=True)
              tags.append(f'{c}-{version}')

          with open('/tmp/tags.txt', 'w') as f:
              for t in tags:
                  f.write(t + '\n')
          PY

      - name: Commit release prep and create version tags
        run: |
          set -euo pipefail
          # Stage every changed chart's Chart.yaml and README.md.
          git add -A -- '*/Chart.yaml' '*/README.md'
          if ! git diff --quiet --cached; then
            CHARTS="$(python3 -c "import json,os;print(', '.join(e['chart']+'-'+e['version'] for e in json.loads(os.environ['CHARTS'])))" 2>/dev/null || true)"
            git commit -m "release(): prepare ${CHARTS}"
            git push
          fi
          # Create and push a <chart>-<version> tag for each prepared chart.
          while read -r TAG; do
            [ -n "$TAG" ] || continue
            if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              git tag "$TAG"
              git push origin "$TAG"
            fi
          done < /tmp/tags.txt
        env:
          CHARTS: ${{ needs.detect.outputs.charts }}

  # Publish a chart on its <chart>-<version> tag: lint, package, push and
  # Cosign-sign to GHCR, publish Artifact Hub repository metadata, and create a
  # GitHub Release named <chart>-<version>.
  release-publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse chart and version from tag
        id: rel
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          CHART="$(printf '%s' "$TAG" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+$//')"
          VERSION="${TAG#${CHART}-}"
          [ -f "${CHART}/Chart.yaml" ] || { echo "chart ${CHART} not found"; exit 1; }
          echo "chart=${CHART}"   >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"       >> "$GITHUB_OUTPUT"
          echo "parsed chart=${CHART} version=${VERSION}"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Install oras
        uses: oras-project/setup-oras@v2
        with:
          version: 1.3.3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Chart Dependencies
        run: helm dependency update "${{ steps.rel.outputs.chart }}/"

      - name: Lint Chart
        run: helm lint "${{ steps.rel.outputs.chart }}/"

      - name: Package Chart
        run: helm package "${{ steps.rel.outputs.chart }}/" --destination ./chart-packages

      - name: Push Chart to GHCR
        run: |
          CHART="${{ steps.rel.outputs.chart }}"
          VERSION="${{ steps.rel.outputs.version }}"
          helm push "./chart-packages/${CHART}-${VERSION}.tgz" oci://ghcr.io/qaoru/helm-charts

      - name: Sign Chart with Cosign
        run: |
          CHART="${{ steps.rel.outputs.chart }}"
          VERSION="${{ steps.rel.outputs.version }}"
          cosign sign --yes "ghcr.io/qaoru/helm-charts/${CHART}:${VERSION}"

      - name: Publish Artifact Hub repository metadata
        run: |
          CHART="${{ steps.rel.outputs.chart }}"
          oras push \
            "ghcr.io/qaoru/helm-charts/${CHART}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.tag }}
          files: |
            ./chart-packages/${{ steps.rel.outputs.chart }}-*.tgz
          generate_release_notes: true