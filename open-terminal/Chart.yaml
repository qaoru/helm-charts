annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: BREAKING. Replaces the single Deployment with an `instances` list of individually-addressable Open Terminal workstations (StatefulSet + headless governing Service, plus a ClusterIP Service when replicaCount==1) so a chat session binds to one stateful endpoint. Each instance gets its own env, resources, image/apiKey/runtimeClassName overrides, persistent PVC (volumeClaimTemplate), and CiliumNetworkPolicy. Stateful, in-process sessions cannot be safely load-balanced across replicas, so replicaCount>1 addresses pods by ordinal DNS and the convenience ClusterIP Service is not created for it.
