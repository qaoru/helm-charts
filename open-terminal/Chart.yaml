annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: BREAKING. Replaces the single Deployment with an `instances` list of individually-addressable Open Terminal workstations -- a StatefulSet per entry (exactly one pod; `replicas` is fixed at 1, since Open Terminal is a stateful in-process server whose per-session cwd, background jobs, and interactive PTY terminals live in pod memory and cannot be safely load-balanced), plus headless governing and ClusterIP Services and a CiliumNetworkPolicy. Each instance gets its own env, resources, image/apiKey/runtimeClassName/nodeSelector overrides, persistent PVC (volumeClaimTemplate), and network policy. Multiple workstations = multiple `instances` entries, not horizontal scaling. The chart-wide stable `open-terminal` Service DNS name is gone; each workstation has its own `open-terminal-<name>` URL, registered manually in the Open WebUI admin UI.
