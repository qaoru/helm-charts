{{- range $inst := .Values.instances }}
{{- $ctx := dict "root" $ "inst" $inst }}
{{- $wsName := include "open-terminal.workstationName" $ctx }}
{{- $np := $inst.networkPolicy | default dict }}
{{- /* Respect an explicit `enabled: false`. Sprig's `default` treats `false` as
     empty, so `($np.enabled | default true)` would render the policy even when
     disabled -- use hasKey to distinguish "unset" (default true) from "false". */ -}}
{{- $npEnabled := true }}
{{- if hasKey $np "enabled" }}{{- $npEnabled = $np.enabled }}{{- end }}
{{- if $npEnabled }}
{{- $flavor := $np.flavor | default "cilium" }}
{{- if eq $flavor "cilium" }}
{{- $ingress := $np.ingress | default dict }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $wsName }}-default-deny
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "open-terminal.workstationLabels" $ctx | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "open-terminal.workstationSelectorLabels" $ctx | nindent 6 }}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $ingress.fromNamespace | default $.Release.Namespace | quote }}
            app.kubernetes.io/name: {{ $ingress.fromName | default "open-webui" | quote }}
      toPorts:
        - ports:
            - port: {{ $ingress.port | default 8000 | quote }}
              protocol: TCP
  # egress: intentionally none (air-gapped). To let the agent reach the network
  # (e.g. pip/apt installs, outbound APIs), add egress rules here and, if the
  # image lacks runtime package tooling, switch to a tag that supports it.
{{- else }}
{{- fail (printf "open-terminal: unsupported networkPolicy.flavor %q (only \"cilium\" is implemented)" $flavor) }}
{{- end }}
{{- end }}
{{- end }}